name: Setup pgrx and ROS2
description: Install ROS2 dependencies and initialize a downloaded PostgreSQL for pgrx

inputs:
  pg_version:
    description: PostgreSQL major version
    required: true

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y software-properties-common curl ca-certificates locales
        sudo locale-gen en_US.UTF-8
        echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
        echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"
        sudo add-apt-repository -y universe
        sudo apt-get update
        sudo apt-get install -y \
          build-essential pkg-config \
          libclang-dev \
          libreadline-dev

    - name: Install ROS 2 Humble
      shell: bash
      run: |
        ROS_APT_SOURCE_VERSION=$(curl -fsSL https://api.github.com/repos/ros-infrastructure/ros-apt-source/releases/latest | python3 -c 'import json, sys; print(json.load(sys.stdin)["tag_name"])')
        UBUNTU_CODENAME=$(. /etc/os-release && echo "${UBUNTU_CODENAME:-${VERSION_CODENAME}}")
        curl -fsSL -o "$RUNNER_TEMP/ros2-apt-source.deb" \
          "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ROS_APT_SOURCE_VERSION}/ros2-apt-source_${ROS_APT_SOURCE_VERSION}.${UBUNTU_CODENAME}_all.deb"
        sudo dpkg -i "$RUNNER_TEMP/ros2-apt-source.deb"
        sudo apt-get update
        sudo apt-get install -y \
          ros-humble-ros-base \
          ros-dev-tools \
          ros-humble-example-interfaces \
          ros-humble-test-msgs

        # Source ROS in subsequent Bash steps, including the caller's build/test steps.
        ROS_BASH_ENV="${BASH_ENV:-$RUNNER_TEMP/ros2-env.bash}"
        echo 'source /opt/ros/humble/setup.bash' >> "$ROS_BASH_ENV"
        echo "BASH_ENV=$ROS_BASH_ENV" >> "$GITHUB_ENV"

    - name: Install cargo-pgrx
      shell: bash
      run: cargo install --locked cargo-pgrx

    - name: Initialize pgrx
      shell: bash
      run: |
        set +e
        v=$(cargo pgrx info version pg${{ inputs.pg_version }})
        if [ $? -ne 0 ]; then
          cargo pgrx init --pg${{ inputs.pg_version }} download
        fi
