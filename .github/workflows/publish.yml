name: Publish Docker Image

on:
  workflow_call:
    inputs:
      version:
        description: pg_ros2 version to publish (without leading v)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: pg_ros2 version to publish (without leading v)
        required: true
        type: string

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    env:
      IMAGE: ghcr.io/sweatybridge/pg_ros2
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            PG_ROS2_VERSION=${{ inputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ inputs.version }}-${{ matrix.arch }}
            ${{ env.IMAGE }}:latest-${{ matrix.arch }}

  manifest:
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/sweatybridge/pg_ros2
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"

          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:latest-amd64" \
            "${IMAGE}:latest-arm64"
        env:
          VERSION: ${{ inputs.version }}
