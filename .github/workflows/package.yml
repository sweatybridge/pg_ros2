name: Package

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        pg_version: [18]
        runner: [ubuntu-22.04, ubuntu-22.04-arm]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-key: pg${{ matrix.pg_version }}-${{ matrix.runner }}
          cache-directories: /home/runner/.pgrx

      - uses: ./.github/actions/setup-pgrx
        with:
          pg_version: ${{ matrix.pg_version }}

      - name: Build extension
        run: cargo pgrx package --features pg${{ matrix.pg_version }} --no-default-features

      - name: Create Debian package
        run: |
          PKG_VERSION=$(grep -oP '^version = "\K[^"]+' Cargo.toml)
          PG_VERSION=${{ matrix.pg_version }}
          UBUNTU_CODENAME=$(lsb_release -cs)
          ARCH=$(dpkg --print-architecture)
          PKG_NAME="pg-ros2-pg${PG_VERSION}"
          PKG_DIR="${PKG_NAME}_${PKG_VERSION}-1~${UBUNTU_CODENAME}_${ARCH}"

          # cargo pgrx package outputs to target/release/pg_ros2-pg$VER/
          SRC_DIR="target/release/pg_ros2-pg${PG_VERSION}"

          mkdir -p "${PKG_DIR}/DEBIAN"
          cp -a "${SRC_DIR}/." "${PKG_DIR}/"

          cat > "${PKG_DIR}/DEBIAN/control" <<EOF
          Package: ${PKG_NAME}
          Version: ${PKG_VERSION}-1
          Section: database
          Priority: optional
          Architecture: ${ARCH}
          Depends: postgresql-${PG_VERSION}
          Maintainer: pg_ros2 contributors
          Description: Provides SQL access to ROS2 interfaces, including
           nodes, topics, services, parameters, and actions.
          EOF

          # Remove leading spaces from control file
          sed -i 's/^          //' "${PKG_DIR}/DEBIAN/control"

          dpkg-deb --build "${PKG_DIR}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pg-ros2-pg${{ matrix.pg_version }}-${{ matrix.runner }}
          path: "*.deb"

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      - name: Get version
        id: version
        run: echo "value=$(grep -oP '^version = "\K[^"]+' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.value }}
          overwrite_files: false
          files: ./*.deb

  docker:
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
