[package]
name = "pg_ros2"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"
description = "Minimal PostgreSQL access to the ROS 2 Humble graph via rclrs"
repository = "https://github.com/sweatybridge/pg_ros2"

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg18"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg_test = []

[dependencies]
pgrx = "=0.19.2"
# This release includes its required message bindings, avoiding a colcon overlay.
rclrs = "=0.7.0"

[dev-dependencies]
pgrx-tests = "=0.19.2"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
