[package]
name = "pg_ros2"
version = "0.3.1"
edition = "2021"
rust-version = "1.96"
license = "MIT"
description = "Minimal PostgreSQL access to the ROS 2 Humble graph via rclrs"
repository = "https://github.com/sweatybridge/pg_ros2"

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg18"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg_test = []
pg_bench = ["dep:pgrx-bench"]

[dependencies]
pgrx = "=0.19.2"
pgrx-bench = { version = "0.19.2", optional = true }
rclrs = "=0.8.0"
ros-env = "0.3"
serde_json = "1"

[dev-dependencies]
pgrx-tests = "=0.19.2"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
